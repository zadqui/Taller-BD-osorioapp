<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Transportadora Osorio</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <div class="auth">
    <aside class="auth-visual">
      <a class="brand" href="index.html"><span class="brand-mark"><i data-lucide="truck"></i></span><span>Transportadora Osorio<small>Panel de operación</small></span></a>
      <img class="auth-illus" src="assets/ilustraciones/authentication.svg" alt="" aria-hidden="true">
      <h2>De la bodega a la entrega, en un solo lugar.</h2>
    </aside>

    <main class="auth-form">
      <form id="f-login" novalidate>
        <h1>Iniciar sesión</h1>
        <p class="sub">Acceso para personal de la empresa.</p>
        <div class="field"><label for="usuario">Usuario</label><input class="input" id="usuario" name="usuario" autocomplete="username" autocapitalize="none" required></div>
        <div class="field"><label for="clave">Contraseña</label>
          <div class="pass-wrap"><input class="input" id="clave" name="clave" type="password" autocomplete="current-password" required>
            <button type="button" class="ver-clave" aria-label="Mostrar contraseña"><i data-lucide="eye"></i></button></div>
        </div>
        <div class="error-text" role="alert"></div>
        <button class="btn dark btn-lg">Entrar<i data-lucide="arrow-right"></i></button>
        <a class="link" href="index.html" style="text-align:center">Volver al sitio</a>
      </form>

      <form id="f-cambio" novalidate hidden>
        <h1>Crea tu contraseña</h1>
        <p class="sub">Es tu primer ingreso. Cambia la contraseña temporal por una propia.</p>
        <div class="field"><label for="actual">Contraseña temporal</label><input class="input" id="actual" name="actual" type="password" autocomplete="current-password" required></div>
        <div class="field"><label for="nueva">Nueva contraseña</label>
          <div class="pass-wrap"><input class="input" id="nueva" name="nueva" type="password" autocomplete="new-password" minlength="10" required>
            <button type="button" class="ver-clave" aria-label="Mostrar contraseña"><i data-lucide="eye"></i></button></div>
          <div class="hint">Mínimo 10 caracteres, con letras y números.</div></div>
        <div class="field"><label for="repetir">Repite la nueva contraseña</label><input class="input" id="repetir" name="repetir" type="password" autocomplete="new-password" required></div>
        <div class="error-text" role="alert"></div>
        <button class="btn dark btn-lg">Guardar y entrar<i data-lucide="arrow-right"></i></button>
      </form>
    </main>
  </div>

  <script src="assets/vendor/lucide.min.js"></script>
  <script src="js/nucleo.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
